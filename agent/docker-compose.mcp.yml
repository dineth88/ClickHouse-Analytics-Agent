# ClickHouse MCP server — gives the agent (LibreChat) tool-call access to
# query ClickHouse. Points at OUR analytics ClickHouse (stackoverflow DB),
# using the read-only `mcp_reader` user created in clickhouse/init/05-create-mcp-reader.sh
# — NOT Langfuse's internal ClickHouse.
services:
  clickhouse-mcp:
    # mcp/clickhouse only publishes a floating `latest` tag on Docker Hub (no
    # versioned tags) — pinned by digest instead, for reproducibility.
    image: mcp/clickhouse@sha256:51bcd33e17adede7cf6de666a50e9b1275d53fbe0f4ad0cfd7bd35678a5b8c3f
    restart: unless-stopped
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_USER: ${CLICKHOUSE_MCP_READER_USER:-mcp_reader}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_MCP_READER_PASSWORD:?set CLICKHOUSE_MCP_READER_PASSWORD in .env}
      CLICKHOUSE_SECURE: "false"
      CLICKHOUSE_MCP_SERVER_TRANSPORT: "http"
      CLICKHOUSE_MCP_BIND_HOST: "0.0.0.0"
      CLICKHOUSE_MCP_BIND_PORT: "8000"
      CLICKHOUSE_MCP_AUTH_TOKEN: ${CLICKHOUSE_MCP_AUTH_TOKEN:?set CLICKHOUSE_MCP_AUTH_TOKEN in .env}
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket; s=socket.create_connection(('localhost',8000),2); s.close()\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
