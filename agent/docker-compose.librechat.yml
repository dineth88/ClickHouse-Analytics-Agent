services:
  librechat:
    image: ghcr.io/danny-avila/librechat:v0.8.7
    restart: unless-stopped
    ports:
      - "${LIBRECHAT_PORT:-3080}:${LIBRECHAT_PORT:-3080}"
    depends_on:
      mongodb:
        condition: service_started
      meilisearch:
        condition: service_started
      clickhouse-mcp:
        condition: service_healthy
      rag_api:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    environment:
      - HOST=0.0.0.0
      - PORT=${LIBRECHAT_PORT:-3080}
      - MONGO_URI=mongodb://mongodb:27017/LibreChat
      - MEILI_HOST=http://meilisearch:7700
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:?set MEILI_MASTER_KEY in .env}
      - RAG_PORT=${RAG_PORT:-8001}
      - RAG_API_URL=http://rag_api:${RAG_PORT:-8001}
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET in .env}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in .env}
      - CREDS_KEY=${CREDS_KEY:?set CREDS_KEY in .env}
      - CREDS_IV=${CREDS_IV:?set CREDS_IV in .env}
      - VECTORDB_DB=${VECTORDB_DB:-mydatabase}
      - VECTORDB_USER=${VECTORDB_USER:-myuser}
      - VECTORDB_PASSWORD=${VECTORDB_PASSWORD}
      # --- Endpoints (Phase 5: google + agents, per PRD) ---
      - ENDPOINTS=google,agents
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-user_provided}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-user_provided}
      # --- Google Vertex AI / Gemini — the only paid/metered component ---
      # GOOGLE_KEY is deliberately NOT set: Vertex AI auth goes through the
      # mounted service-account file below, not an API key.
      - GOOGLE_LOC=${GOOGLE_CLOUD_LOCATION:-us-central1}
      - GOOGLE_SERVICE_KEY_FILE=/app/credentials/service-account.json
      - GOOGLE_MODELS=${GOOGLE_MODELS:-gemini-2.5-flash,gemini-2.5-pro}
      - GOOGLE_TITLE_MODEL=gemini-2.5-flash
      # --- ClickHouse MCP ---
      - CLICKHOUSE_MCP_AUTH_TOKEN=${CLICKHOUSE_MCP_AUTH_TOKEN}
      # --- Langfuse tracing: every prompt / tool call / SQL / response traced ---
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY}
      - LANGFUSE_BASE_URL=${LANGFUSE_BASE_URL:-http://langfuse-web:3000}
    volumes:
      - type: bind
        source: ./librechat.yaml
        target: /app/librechat.yaml
        read_only: true
      - type: bind
        # Rotated service-account key, referenced BY PATH only — never baked
        # into the image, never committed. Set in .env, not here.
        source: ${GOOGLE_APPLICATION_CREDENTIALS_HOST_PATH}
        target: /app/credentials/service-account.json
        read_only: true
      - librechat_images:/app/client/public/images
      - librechat_uploads:/app/uploads

  librechat-user-init:
    image: docker:27-cli
    restart: "no"
    depends_on:
      librechat:
        condition: service_healthy
      mongodb:
        condition: service_started
    environment:
      - LIBRECHAT_USER_EMAIL=${LIBRECHAT_USER_EMAIL}
      - LIBRECHAT_USER_PASSWORD=${LIBRECHAT_USER_PASSWORD}
      - LIBRECHAT_USER_NAME=${LIBRECHAT_USER_NAME}
      - LIBRECHAT_PORT=${LIBRECHAT_PORT:-3080}
      - COMPOSE_PROJECT_NAME=${COMPOSE_PROJECT_NAME:-clickhouse-analytics-agent}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - type: bind
        source: ./scripts/init-librechat-user.sh
        target: /init-user.sh
        read_only: true
    working_dir: /
    entrypoint: ["/bin/sh", "/init-user.sh"]

  mongodb:
    image: mongo:8.0.28
    restart: unless-stopped
    volumes:
      - librechat_mongodb_data:/data/db
    command: mongod --noauth
    ports:
      - "127.0.0.1:27017:27017"

  meilisearch:
    image: getmeili/meilisearch:v1.12.3
    restart: unless-stopped
    environment:
      - MEILI_HOST=http://meilisearch:7700
      - MEILI_NO_ANALYTICS=true
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
    volumes:
      - librechat_meili_data:/meili_data
    ports:
      - "127.0.0.1:7700:7700"

  vectordb:
    image: pgvector/pgvector:0.8.0-pg15-trixie
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${VECTORDB_DB:-mydatabase}
      POSTGRES_USER: ${VECTORDB_USER:-myuser}
      POSTGRES_PASSWORD: ${VECTORDB_PASSWORD:?set VECTORDB_PASSWORD in .env}
    volumes:
      - librechat_vectordb_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"

  rag_api:
    image: ghcr.io/danny-avila/librechat-rag-api-dev-lite:v0.8.0
    restart: unless-stopped
    environment:
      - DB_HOST=vectordb
      - RAG_PORT=${RAG_PORT:-8001}
      - POSTGRES_DB=${VECTORDB_DB:-mydatabase}
      - POSTGRES_USER=${VECTORDB_USER:-myuser}
      - POSTGRES_PASSWORD=${VECTORDB_PASSWORD}
      - OPENAI_API_KEY=${RAG_OPENAI_API_KEY:-${OPENAI_API_KEY:-}}
    depends_on:
      vectordb:
        condition: service_started
    ports:
      - "127.0.0.1:${RAG_PORT:-8001}:${RAG_PORT:-8001}"

volumes:
  librechat_mongodb_data:
  librechat_meili_data:
  librechat_vectordb_data:
  librechat_images:
  librechat_uploads:
