# LibreChat Configuration File
# For more information, see: https://www.librechat.ai/docs/configuration/librechat_yaml
# Adapted from github.com/ClickHouse/agentic-data-stack, pointed at OUR
# analytics ClickHouse MCP server instead of the public ClickHouse Cloud demo.

version: 1.3.1

cache: true

interface:
  fileCitations: true
  mcpServers:
    use: true
    share: false
    create: true
    public: false

endpoints:
  agents:
    capabilities:
      - programmatic_tools
      - deferred_tools
      - execute_code
      - artifacts
      - actions
      - context
      - tools
      - chain
  google:
    fetch: true

mcpSettings:
  allowedDomains:
    - "http://clickhouse-mcp:8000"

mcpServers:
  ClickHouse-StackOverflow:
    type: streamable-http
    url: http://clickhouse-mcp:8000/mcp
    timeout: 60000 # 1 minute timeout
    headers:
      Authorization: "Bearer ${CLICKHOUSE_MCP_AUTH_TOKEN}"
